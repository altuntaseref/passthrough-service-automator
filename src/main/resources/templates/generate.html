<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Project Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1 class="text-center mb-4">Project Generator</h1>
    <form id="projectForm" class="p-4 shadow rounded bg-light">
        <div class="mb-3">
            <label for="projectName" class="form-label">Project Name</label>
            <input type="text" class="form-control" id="projectName" name="projectName" placeholder="Enter project name" required/>
        </div>
        <div class="mb-3">
            <label for="projectType" class="form-label">Project Type</label>
            <select id="projectType" name="projectType" class="form-select">
                <option value="REST">REST</option>
                <option value="SOAP">SOAP</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="groupId" class="form-label">Group ID</label>
            <input type="text" class="form-control" id="groupId" name="groupId" placeholder="Enter group ID" required/>
        </div>
        <div class="mb-3">
            <label for="artifactId" class="form-label">Artifact ID</label>
            <input type="text" class="form-control" id="artifactId" name="artifactId" placeholder="Enter artifact ID" required/>
        </div>
        <div class="mb-3">
            <label for="outputPath" class="form-label">Output Path</label>
            <input type="text" class="form-control" id="outputPath" name="outputPath" placeholder="Enter output path" required/>
        </div>
        <div class="mb-3">
            <label for="dependencies" class="form-label">Dependencies (Comma Separated)</label>
            <input type="text" class="form-control" id="dependencies" name="dependencies" placeholder="e.g., Spring Web, Spring Data"/>
        </div>
        <div class="mb-3">
            <label for="javaVersion" class="form-label">Java Version</label>
            <input type="text" class="form-control" id="javaVersion" name="javaVersion" placeholder="Enter Java version" required/>
        </div>
        <div class="mb-3">
            <label for="springBootVersion" class="form-label">Spring Boot Version</label>
            <input type="text" class="form-control" id="springBootVersion" name="springBootVersion" placeholder="Enter Spring Boot version" required/>
        </div>
        <div class="mb-3">
            <label for="authType" class="form-label">Auth Type</label>
            <select id="authType" name="authType" class="form-select">
                <option value="None">None</option>
                <option value="Basic">Basic</option>
                <option value="Bearer">Bearer</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="baseUrl" class="form-label">Base URL</label>
            <input type="text" class="form-control" id="baseUrl" name="baseUrl" placeholder="Enter base URL"/>
        </div>
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" name="username" placeholder="Enter username"/>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="Enter password"/>
        </div>
        <div class="mb-3">
            <label for="apiKey" class="form-label">API Key</label>
            <input type="text" class="form-control" id="apiKey" name="apiKey" placeholder="Enter API key"/>
        </div>
        <div class="mb-3">
            <label for="systemName" class="form-label">System Name</label>
            <input type="text" class="form-control" id="systemName" name="systemName" placeholder="Enter system name"/>
        </div>
        <div class="mb-3">
            <label for="jsonBody" class="form-label">JSON Body</label>
            <textarea class="form-control" id="jsonBody" name="jsonBody" rows="3" placeholder="Enter JSON body"></textarea>
        </div>
        <div class="text-center">
            <button type="submit" class="btn btn-primary mt-3">Generate Project</button>
        </div>
    </form>
    <div id="responseMessage" class="mt-3 text-center"></div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- JavaScript dosyasını ekliyoruz -->
<script src="/js/main.js"></script>
</body>
</html>
